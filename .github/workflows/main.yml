name: Build Report-saham APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            find extracted -maxdepth 8 -print
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify app module
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE was not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Using module Gradle file:"
          echo "$APP_GRADLE"

      - name: Prepare clean build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT_DIR/app/build"
          rm -rf "$PROJECT_DIR/.gradle"

          echo "Previous build outputs removed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify exact APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected APK was not generated:"
            echo "$APK"
            find "$PROJECT_DIR/app/build" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          echo "Running APK signature verification..."
          "$APKSIGNER" verify --verbose "$APK_PATH"

          echo "APK signature verification PASSED."

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Report-saham-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
